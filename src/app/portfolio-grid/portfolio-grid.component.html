<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 project-container">
    <div class="col p-0" *ngFor="let project of projects">
        <div class="card img-container bg-white">
            <div class="overlay border border-1 rounded">
                <div class="overlay-text">
                  <a class="details" [routerLink]="['/details', project.id]" routerLinkActive="active"></a>

                  <ul class="bg-gradient tags">
                    <li class="btn btn-outline-transparent rounded-1 github">
                      <a target="_blank" rel="external" href={{project.repo}} aria-label="GitHub Repository">
                      <i class="fa-brands fa-github-alt" alt="Checkout my project on GitHub"></i></a>
                    </li>
                    <li class="btn btn-outline-light rounded-1 tag" *ngFor="let item of project.type">{{item}}</li>
                  </ul>
                </div>
              
                <img [src]="project.img" class="card-img-top rounded" alt={{project.img_alt}}>
            </div>
        </div>  
    </div>
</div>
