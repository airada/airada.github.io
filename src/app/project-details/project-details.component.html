        <p><a routerLink="/home" routerLinkActive="active">Home</a> / <a routerLink="/portfolio" routerLinkActive="active">Portfolio</a> / <span>Personal Website</span></p>
        
        

        <div class="row row-cols-1 row-cols-lg-2 mb-5">
            <div class="col d-flex justify-content-center align-items-center border border-1 rounded">
                <img class="img-fluid" src={{img_src}}>
            </div>
            <div class="col ps-md-4">
                <h2 class="text-center mt-5 mt-lg-0"> {{project.title | uppercase}}</h2>
                <br>
                <h3>OBJECTIVE</h3>
                <p>{{project.objective}} </p>
                <br>
                <h3>RESULTS</h3>
                <p>{{project.result}}</p>
                <br>
                <h3>NOTABLE FEATURES</h3>
                <p>{{project.features}}</p>
                <br>
                <h3>TECHNOLOGIES</h3>
                <p>{{skills}}</p>
                <br>
                <a href={{project.repo}}><i class="fa-brands fa-github-alt fa-xl" alt="Checkout my project on GitHub"></i></a>

            </div>
        </div>
