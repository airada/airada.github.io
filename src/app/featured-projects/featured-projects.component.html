<div data-aos="fade-up" data-aos-duration="1000" data-aos-once="true" class="col project-container" *ngFor="let project of projects">
  <div class="col img-container d-flex justify-content-center align-items-lg-end rounded">
    <div (mouseover)="updateSRC(project.id, '.png')" (mouseout)="updateSRC(project.id, '.jpg')" class="overlay border border-1 rounded">
      <div class="overlay-text">
        <div class="bg-gradient-top">
          <h3>{{project.title}}</h3>
          <p class="pb-0 mb-0">{{project.summary}}</p>
          <p class="more"><a [routerLink]="['/details', project.id]" routerLinkActive="active">LEARN MORE</a>
          </p>
        </div>

        <ul class="bg-gradient tags">
          <!-- <li class="btn btn-outline-transparent rounded-1 github">
            <a target="_blank" rel="external" href={{project.repo}} aria-label="GitHub Repository">
            <i class="fa-brands fa-github-alt" alt="Checkout my project on GitHub"></i></a>
          </li> -->
          <li class="btn btn-outline-light rounded-1 tag" *ngFor="let item of project.type">{{item}}</li>
        </ul>

      </div>
      <img id="project.id" [src]="project.img" class="rounded" [alt]="project.img_alt">
    </div>
  </div>
</div>
